<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-3 font-sans">
    <!-- Başlık -->
    <div class="flex items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-amber-500">⚡ Bölüm 1: İki Yollu Koşul (If-Else)</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 font-medium">Koşul / Decision</span>
      </div>
      <div id="scoreLabel" class="text-xs font-semibold text-[var(--muted-foreground)]">Başarı: <span id="scoreText" class="text-emerald-500 font-bold">0 / 3</span></div>
    </div>

    <!-- Oyun Sahnesi -->
    <div class="relative w-full h-[230px] rounded-xl border border-[var(--card-border)] bg-[var(--card)] flex flex-col items-center justify-between p-4 overflow-hidden shadow-inner">
      <!-- Koşul Kuralı Göstergesi -->
      <div class="text-center">
        <div id="ruleBox" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[var(--background)] border border-[var(--card-border)] text-xs font-medium text-[var(--foreground)] shadow-sm">
          <span>🎧 "Sinyal Çal" butonuna bas ve doğru hedefe dokun!</span>
        </div>
      </div>

      <!-- Dalga Efekt Merkezi -->
      <div class="relative w-24 h-24 flex items-center justify-center">
        <div id="waveEffect" class="absolute w-12 h-12 rounded-full border-4 border-transparent transition-all duration-700 opacity-0 scale-50"></div>
        <button id="playSignalBtn" onclick="emitSignal()" class="w-16 h-16 rounded-full bg-[var(--primary)] hover:scale-105 active:scale-95 text-white flex flex-col items-center justify-center shadow-lg transition-transform z-10 cursor-pointer">
          <span class="text-lg">🔔</span>
          <span class="text-[9px] font-bold">Sinyal Ver</span>
        </button>
      </div>

      <!-- İki Seçenek Kapısı (Davul vs Zil) -->
      <div class="w-full flex items-center justify-around gap-4 z-10">
        <!-- Mor Davul Kapısı -->
        <button onclick="chooseOption('drum')" class="flex-1 py-2.5 px-3 rounded-lg border-2 border-purple-400/40 bg-purple-500/10 hover:bg-purple-500/20 active:scale-95 transition-all text-center cursor-pointer flex items-center justify-center gap-2">
          <span class="text-xl">🥁</span>
          <div class="text-left">
            <div class="text-xs font-bold text-purple-400">Mor Davul</div>
            <div class="text-[10px] text-[var(--muted-foreground)]">Eğer kalın ses/mor dalga ise</div>
          </div>
        </button>

        <!-- Sarı Zil Kapısı -->
        <button onclick="chooseOption('bell')" class="flex-1 py-2.5 px-3 rounded-lg border-2 border-amber-400/40 bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 transition-all text-center cursor-pointer flex items-center justify-center gap-2">
          <span class="text-xl">🔔</span>
          <div class="text-left">
            <div class="text-xs font-bold text-amber-500">Sarı Zil</div>
            <div class="text-[10px] text-[var(--muted-foreground)]">Eğer ince ses/sarı dalga ise</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Alt Açıklama -->
    <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
      <span>Tekil bekleme yerine gerçek iki yollu karar mekanizması (`Eğer ... değilse ...`).</span>
      <span id="feedbackText" class="font-bold text-emerald-500"></span>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      if (type === 'drum') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      }
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (type === 'drum' ? 0.3 : 0.5));
    }

    let activeSignal = null;
    let score = 0;

    function emitSignal() {
      activeSignal = Math.random() > 0.5 ? 'drum' : 'bell';
      playSound(activeSignal);

      const wave = document.getElementById('waveEffect');
      wave.className = `absolute w-20 h-20 rounded-full border-4 transition-all duration-700 opacity-90 scale-150 ${
        activeSignal === 'drum' ? 'border-purple-500 bg-purple-500/20' : 'border-amber-400 bg-amber-400/20'
      }`;

      document.getElementById('ruleBox').innerHTML = activeSignal === 'drum' 
        ? `<span class="text-purple-400 font-bold">🥁 Kalın davul sesi & Mor dalga geldi! Hangi kapı?</span>`
        : `<span class="text-amber-500 font-bold">🔔 İnce zil sesi & Sarı dalga geldi! Hangi kapı?</span>`;

      setTimeout(() => {
        wave.className = "absolute w-12 h-12 rounded-full border-4 border-transparent transition-all duration-300 opacity-0 scale-50";
      }, 700);
    }

    function chooseOption(choice) {
      if (!activeSignal) {
        document.getElementById('feedbackText').innerText = "Önce ortadaki 'Sinyal Ver' butonuna bas!";
        return;
      }
      if (choice === activeSignal) {
        score++;
        document.getElementById('scoreText').innerText = `${score} / 3`;
        document.getElementById('feedbackText').innerText = "Harika! Doğru koşulu seçtin! 🎉";
        playSound('bell');
        activeSignal = null;
        if (score >= 3) {
          document.getElementById('ruleBox').innerHTML = `<span class="text-emerald-500 font-bold">🏆 Tebrikler! If-Else mantığını çözdün!</span>`;
        }
      } else {
        document.getElementById('feedbackText').innerText = "Fırçanın kafası karıştı, sinyali tekrar dinleyelim!";
        activeSignal = null;
      }
    }
  </script>
</body>
</html>
