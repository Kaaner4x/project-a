<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Bölüm 3: Geometrik Dans ve Ritmik Döngüler</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --foreground: #0f172a;
      --background: #ffffff;
      --card: #f8fafc;
      --card-border: #e2e8f0;
      --primary: #6366f1;
      --muted-foreground: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --foreground: #f8fafc;
        --background: #0f172a;
        --card: #1e293b;
        --card-border: #334155;
        --primary: #818cf8;
        --muted-foreground: #94a3b8;
      }
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-3 font-sans">
    <!-- Başlık ve Yaş Katmanı Seçimi -->
    <div class="flex items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-violet-500">📐 Bölüm 3: Geometrik Dans ve Ritmik Döngüler</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-violet-500/10 text-violet-600 font-medium">Poligon & Mandala</span>
      </div>
      <!-- Yaş Modu Anahtarı -->
      <div class="flex items-center gap-1 bg-[var(--card)] border border-[var(--card-border)] p-0.5 rounded-lg text-xs">
        <button onclick="setTier('kids')" id="tierKids" class="px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold transition-all">7-9 Yaş (Şekil & Ritim)</button>
        <button onclick="setTier('pro')" id="tierPro" class="px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold transition-all">10-14 Yaş (Açı & İç İçe Döngü)</button>
      </div>
    </div>

    <!-- Şekil Seçim Sekmeleri -->
    <div class="flex items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-1.5" id="shapeButtons">
        <button onclick="selectShape('triangle')" id="btn-triangle" class="px-3 py-1.5 rounded-lg border border-[var(--card-border)] hover:bg-[var(--card)] font-bold text-xs flex items-center gap-1.5 transition-all">
          <span>🔺</span> <span>Üçgen (3x)</span>
        </button>
        <button onclick="selectShape('square')" id="btn-square" class="px-3 py-1.5 rounded-lg border border-[var(--card-border)] hover:bg-[var(--card)] font-bold text-xs flex items-center gap-1.5 transition-all">
          <span>🟩</span> <span>Kare (4x)</span>
        </button>
        <button onclick="selectShape('hexagon')" id="btn-hexagon" class="px-3 py-1.5 rounded-lg border border-[var(--card-border)] hover:bg-[var(--card)] font-bold text-xs flex items-center gap-1.5 transition-all">
          <span>🛑</span> <span>Altıgen (6x)</span>
        </button>
        <button onclick="selectShape('mandala')" id="btn-mandala" class="px-3 py-1.5 rounded-lg bg-[var(--primary)] text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition-all">
          <span>🌸</span> <span>Mandala Çiçeği (İç İçe)</span>
        </button>
      </div>
      <div id="mathBadge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded bg-[var(--card)] border border-[var(--card-border)] font-mono text-[11px] text-[var(--muted-foreground)]">
        <span id="mathBadgeLabel">Örüntü:</span>
        <span id="angleFormula" class="font-bold text-[var(--primary)]">Dış: 6x, İç: 4x (24 Adım)</span>
      </div>
    </div>

    <!-- Tuval ve Animasyon Alanı -->
    <div class="relative w-full h-[230px] rounded-xl border border-[var(--card-border)] bg-[var(--card)] flex flex-col items-center justify-center overflow-hidden shadow-inner">
      <canvas id="mandalaCanvas" width="560" height="230" class="w-full h-full"></canvas>

      <!-- Bilgi Rozeti -->
      <div id="statusBadge" class="absolute bottom-3 left-3 bg-black/50 backdrop-blur px-3 py-1 rounded-full text-xs text-white flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusText">Fırça merkezde hazır. Şekil seç ve çizimi başlat!</span>
      </div>

      <!-- Sayaç Göstergesi -->
      <div class="absolute top-3 right-3 bg-[var(--background)]/85 backdrop-blur border border-[var(--card-border)] px-3 py-1.5 rounded-lg text-center shadow-sm">
        <div id="counterLabel" class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Döngü Adımı</div>
        <div id="stepCounter" class="text-base font-black text-[var(--primary)] tabular-nums">0 / 24</div>
      </div>

      <!-- Çalan Nota Rozeti -->
      <div id="noteBadge" class="absolute top-3 left-3 bg-indigo-600/80 backdrop-blur px-2.5 py-1 rounded-md text-[11px] text-white font-mono font-bold flex items-center gap-1 opacity-0 transition-opacity">
        <span>🎵</span> <span id="currentNoteText">Do</span>
      </div>
    </div>

    <!-- Alt Butonlar ve Kontroller -->
    <div class="flex items-center justify-between pt-1">
      <p id="pedagogyHint" class="text-xs text-[var(--muted-foreground)]">İç içe döngü: Dış döngü 6 yaprağı döndürür, iç döngü her yaprak için bir kare çizer.</p>
      <div class="flex items-center gap-2">
        <button onclick="clearCanvas()" class="px-3 py-1.5 rounded-lg border border-[var(--card-border)] hover:bg-[var(--card)] font-semibold text-xs transition-all">
          🧹 Temizle
        </button>
        <button id="runBtn" onclick="runDrawing()" class="px-5 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs flex items-center gap-2 shadow-md transition-all active:scale-95">
          <span>▶ Çizimi & Ritmi Başlat</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const pentatonic = [
      { note: 'Do', freq: 261.63, color: '#ef4444' },
      { note: 'Re', freq: 293.66, color: '#f59e0b' },
      { note: 'Mi', freq: 329.63, color: '#10b981' },
      { note: 'Sol', freq: 392.00, color: '#06b6d4' },
      { note: 'La', freq: 440.00, color: '#8b5cf6' },
      { note: 'Tiz Do', freq: 523.25, color: '#ec4899' }
    ];

    function playTone(freq, type = 'sine', duration = 0.28) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.22, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playDrum() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    }

    const canvas = document.getElementById('mandalaCanvas');
    const ctx = canvas.getContext('2d');
    let activeShape = 'mandala';
    let currentTier = 'kids';
    let isDrawing = false;
    let animId = null;

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('tierKids').className = tier === 'kids'
        ? "px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold transition-all"
        : "px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold transition-all";
      document.getElementById('tierPro').className = tier === 'pro'
        ? "px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold transition-all"
        : "px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold transition-all";
      updateDescriptions();
    }

    function selectShape(shape) {
      if (isDrawing) return;
      activeShape = shape;
      ['triangle', 'square', 'hexagon', 'mandala'].forEach(s => {
        const btn = document.getElementById(`btn-${s}`);
        if (s === shape) {
          btn.className = "px-3 py-1.5 rounded-lg bg-[var(--primary)] text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition-all";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg border border-[var(--card-border)] hover:bg-[var(--card)] font-bold text-xs flex items-center gap-1.5 transition-all";
        }
      });
      updateDescriptions();
      clearCanvas();
    }

    function updateDescriptions() {
      const mathBadge = document.getElementById('angleFormula');
      const mathBadgeLabel = document.getElementById('mathBadgeLabel');
      const hint = document.getElementById('pedagogyHint');
      const counterLabel = document.getElementById('counterLabel');
      const stepCounter = document.getElementById('stepCounter');

      if (activeShape === 'triangle') {
        if (mathBadgeLabel) mathBadgeLabel.innerText = "Açı:";
        mathBadge.innerText = currentTier === 'kids' ? "3 Köşe (Zil)" : "360° / 3 = 120° (3 vuruş)";
        hint.innerText = currentTier === 'kids' 
          ? "3 kenar, her köşede üçgen zil sesi çalar!" 
          : "Döngü: 3 kez [İleri Git(80), 120° Sola Dön]. Dış açı toplamı = 360°.";
        counterLabel.innerText = "Kenar";
        if (!isDrawing) stepCounter.innerText = "0 / 3";
      } else if (activeShape === 'square') {
        if (mathBadgeLabel) mathBadgeLabel.innerText = "Açı:";
        mathBadge.innerText = currentTier === 'kids' ? "4 Kenar (Davul)" : "360° / 4 = 90° (4 vuruş)";
        hint.innerText = currentTier === 'kids'
          ? "4 kenar, her köşede ritmik davul vuruşu duyulur!"
          : "Döngü: 4 kez [İleri Git(70), 90° Dön]. 4/4'lük temel müzik ölçüsü.";
        counterLabel.innerText = "Kenar";
        if (!isDrawing) stepCounter.innerText = "0 / 4";
      } else if (activeShape === 'hexagon') {
        if (mathBadgeLabel) mathBadgeLabel.innerText = "Açı:";
        mathBadge.innerText = currentTier === 'kids' ? "6 Kenar (Petek)" : "360° / 6 = 60° (Armoni)";
        hint.innerText = currentTier === 'kids'
          ? "6 kenar, her köşede 6 pentatonik nota sırayla tınlar!"
          : "Döngü: 6 kez [İleri Git(55), 60° Dön]. Düzgün çokgen algoritması.";
        counterLabel.innerText = "Kenar";
        if (!isDrawing) stepCounter.innerText = "0 / 6";
      } else {
        if (mathBadgeLabel) mathBadgeLabel.innerText = "Örüntü:";
        mathBadge.innerText = currentTier === 'kids' ? "6 Çiçek x 4 Kare" : "Dış: 6x, İç: 4x (24 Adım)";
        hint.innerText = currentTier === 'kids'
          ? "İç içe döngü: Dış döngü 6 yaprağı döndürür, iç döngü her yaprak için bir kare çizer."
          : "İç İçe Döngü: for(y=0; y<6; y++) { for(k=0; k<4; k++) {...} rot += 60°; } Toplam 24 iterasyon.";
        counterLabel.innerText = "Toplam İterasyon";
        if (!isDrawing) stepCounter.innerText = "0 / 24";
      }
    }

    function clearCanvas() {
      if (animId) cancelAnimationFrame(animId);
      isDrawing = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      document.getElementById('runBtn').disabled = false;
      document.getElementById('runBtn').classList.remove('opacity-50');
      document.getElementById('statusText').innerText = "Fırça merkezde hazır. Şekil seç ve çizimi başlat!";
      document.getElementById('noteBadge').classList.add('opacity-0');
      updateDescriptions();
    }

    function drawGrid() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      ctx.save();
      ctx.strokeStyle = "rgba(160, 160, 180, 0.12)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, Math.PI * 2);
      ctx.arc(cx, cy, 75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 90, cy); ctx.lineTo(cx + 90, cy);
      ctx.moveTo(cx, cy - 90); ctx.lineTo(cx, cy + 90);
      ctx.stroke();
      ctx.restore();
    }

    clearCanvas();

    function showNote(noteText, color) {
      const badge = document.getElementById('noteBadge');
      const text = document.getElementById('currentNoteText');
      text.innerText = noteText;
      badge.style.backgroundColor = color;
      badge.classList.remove('opacity-0');
      clearTimeout(badge._timer);
      badge._timer = setTimeout(() => badge.classList.add('opacity-0'), 450);
    }

    function runDrawing() {
      if (isDrawing) return;
      isDrawing = true;
      document.getElementById('runBtn').disabled = true;
      document.getElementById('runBtn').classList.add('opacity-50');
      document.getElementById('statusText').innerText = "Döngü çalışıyor, fırça geometrik dans ediyor...";

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (activeShape === 'triangle') {
        runPolygon(3, 80, 120, 'triangle');
      } else if (activeShape === 'square') {
        runPolygon(4, 75, 90, 'square');
      } else if (activeShape === 'hexagon') {
        runPolygon(6, 60, 60, 'hexagon');
      } else {
        runMandala();
      }
    }

    function runPolygon(sides, sideLength, turnAngleDeg, shapeType) {
      let currentSide = 0;
      let progress = 0;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Başlangıç noktası hesabı (şekli merkeze oturtmak için)
      const radius = sideLength / (2 * Math.sin(Math.PI / sides));
      let points = [];
      for (let i = 0; i < sides; i++) {
        const ang = (i * 2 * Math.PI / sides) - (Math.PI / 2);
        points.push({ x: cx + radius * Math.cos(ang), y: cy + radius * Math.sin(ang) });
      }

      function redrawScene(currX, currY, activeColor) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // Tamamlanan kenarları çiz
        for (let i = 0; i < currentSide; i++) {
          const ptA = points[i];
          const ptB = points[(i + 1) % sides];
          const segNote = pentatonic[i % pentatonic.length];
          ctx.beginPath();
          ctx.moveTo(ptA.x, ptA.y);
          ctx.lineTo(ptB.x, ptB.y);
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = segNote.color;
          ctx.shadowColor = segNote.color;
          ctx.shadowBlur = 8;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Çizilmekte olan mevcut kenar
        if (currentSide < sides) {
          const p1 = points[currentSide];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(currX, currY);
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = activeColor;
          ctx.shadowColor = activeColor;
          ctx.shadowBlur = 8;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Hareketli fırça başı
          drawBrush(currX, currY, activeColor);
        }
      }

      function step() {
        if (currentSide >= sides) {
          redrawScene(points[0].x, points[0].y, pentatonic[0].color);
          finishDrawing(sides, `${sides} kenarlı şekil döngüsü başarıyla bitti! 🎉`);
          return;
        }

        const p1 = points[currentSide];
        const p2 = points[(currentSide + 1) % sides];

        progress += 0.06;
        if (progress >= 1) {
          progress = 1;
        }

        const currX = p1.x + (p2.x - p1.x) * progress;
        const currY = p1.y + (p2.y - p1.y) * progress;
        const noteObj = pentatonic[currentSide % pentatonic.length];

        redrawScene(currX, currY, noteObj.color);

        if (progress >= 1) {
          currentSide++;
          progress = 0;
          document.getElementById('stepCounter').innerText = `${currentSide} / ${sides}`;

          if (shapeType === 'square') {
            playDrum();
            showNote(`Vuruş ${currentSide}`, '#f59e0b');
          } else {
            playTone(noteObj.freq, 'triangle', 0.35);
            showNote(noteObj.note, noteObj.color);
          }
        }

        animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    }

    function runMandala() {
      const outerLoops = 6;
      const innerSides = 4;
      const totalSteps = outerLoops * innerSides;
      let currentOuter = 0;
      let currentInner = 0;
      let progress = 0;
      let globalStep = 0;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const squareSize = 52;

      function getSquarePoints(centerRot) {
        let pts = [];
        const basePts = [
          { x: 0, y: 0 },
          { x: squareSize, y: 0 },
          { x: squareSize, y: squareSize },
          { x: 0, y: squareSize }
        ];
        basePts.forEach(pt => {
          const cos = Math.cos(centerRot);
          const sin = Math.sin(centerRot);
          pts.push({
            x: cx + (pt.x * cos - pt.y * sin),
            y: cy + (pt.x * sin + pt.y * cos)
          });
        });
        return pts;
      }

      function redrawMandalaScene(currX, currY, activeColor) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // Tamamlanmış yaprakları çiz
        for (let o = 0; o < currentOuter; o++) {
          const rot = (o * 2 * Math.PI) / outerLoops;
          const pts = getSquarePoints(rot);
          const col = pentatonic[o % pentatonic.length].color;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let s = 1; s < innerSides; s++) {
            ctx.lineTo(pts[s].x, pts[s].y);
          }
          ctx.closePath();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = col;
          ctx.shadowColor = col;
          ctx.shadowBlur = 6;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Mevcut yaprağın tamamlanmış kenarları
        if (currentOuter < outerLoops) {
          const rot = (currentOuter * 2 * Math.PI) / outerLoops;
          const curPts = getSquarePoints(rot);
          const curCol = pentatonic[currentOuter % pentatonic.length].color;

          for (let s = 0; s < currentInner; s++) {
            const pA = curPts[s];
            const pB = curPts[(s + 1) % innerSides];
            ctx.beginPath();
            ctx.moveTo(pA.x, pA.y);
            ctx.lineTo(pB.x, pB.y);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = curCol;
            ctx.shadowColor = curCol;
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          // Çizilmekte olan kenar
          const pStart = curPts[currentInner];
          ctx.beginPath();
          ctx.moveTo(pStart.x, pStart.y);
          ctx.lineTo(currX, currY);
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = curCol;
          ctx.shadowColor = curCol;
          ctx.shadowBlur = 6;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Fırça
          drawBrush(currX, currY, curCol);
        }
      }

      function step() {
        if (currentOuter >= outerLoops) {
          redrawMandalaScene(cx, cy, pentatonic[0].color);
          finishDrawing(totalSteps, "Mandala Çiçeği iç içe döngüsü (6 x 4 = 24 adım) tamamlandı! 🌸");
          return;
        }

        const rot = (currentOuter * 2 * Math.PI) / outerLoops;
        const curPoints = getSquarePoints(rot);
        const p1 = curPoints[currentInner];
        const p2 = curPoints[(currentInner + 1) % innerSides];

        progress += 0.12;
        if (progress >= 1) progress = 1;

        const currX = p1.x + (p2.x - p1.x) * progress;
        const currY = p1.y + (p2.y - p1.y) * progress;
        const noteObj = pentatonic[currentOuter % pentatonic.length];

        redrawMandalaScene(currX, currY, noteObj.color);

        if (progress >= 1) {
          currentInner++;
          globalStep++;
          progress = 0;
          document.getElementById('stepCounter').innerText = `${globalStep} / ${totalSteps}`;

          playTone(noteObj.freq * (1 + currentInner * 0.12), 'sine', 0.22);
          showNote(`${noteObj.note} (Yaprak ${currentOuter + 1})`, noteObj.color);

          if (currentInner >= innerSides) {
            currentInner = 0;
            currentOuter++;
          }
        }

        animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    }

    function drawBrush(x, y, color) {
      // Dış ışıma halkası
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.35;
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // İç parlak çekirdek
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    function finishDrawing(total, message) {
      isDrawing = false;
      document.getElementById('runBtn').disabled = false;
      document.getElementById('runBtn').classList.remove('opacity-50');
      document.getElementById('statusText').innerText = message;
      // Kutlama akoru
      setTimeout(() => playTone(523.25, 'sine', 0.4), 100);
      setTimeout(() => playTone(659.25, 'triangle', 0.5), 250);
    }
  </script>
</body>
</html>
