<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-3 font-sans">
    <!-- Başlık ve Yaş Katmanı Seçimi -->
    <div class="flex items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-indigo-500">🎛️ Bölüm 2: İkili Sayı (Binary) Bulmacası</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 font-medium">Binary / Bitmask</span>
      </div>
      <!-- Yaş Modu Anahtarı -->
      <div class="flex items-center gap-1 bg-[var(--card)] border border-[var(--card-border)] p-0.5 rounded-lg text-xs">
        <button onclick="setTier('kids')" id="tierKids" class="px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold">7-9 Yaş (Benekler)</button>
        <button onclick="setTier('pro')" id="tierPro" class="px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold">10-14 Yaş (Bitler)</button>
      </div>
    </div>

    <!-- Oyun Sahnesi -->
    <div class="relative w-full h-[230px] rounded-xl border border-[var(--card-border)] bg-[var(--card)] flex flex-col items-center justify-between p-4 overflow-hidden shadow-inner">
      <!-- Hedef Sayı Göstergesi -->
      <div class="w-full flex items-center justify-between px-3">
        <div class="flex items-center gap-2">
          <span class="text-xs text-[var(--muted-foreground)]">Hedef:</span>
          <span id="targetValueBadge" class="px-3 py-0.5 rounded-full bg-amber-500 text-white font-black text-sm tabular-nums">5</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-[var(--muted-foreground)]">Şu Anki Toplam:</span>
          <span id="currentTotalBadge" class="px-3 py-0.5 rounded-full bg-zinc-700 text-white font-black text-sm tabular-nums">0</span>
        </div>
      </div>

      <!-- 4 Ampul ve Anahtarları (Değerler: 8, 4, 2, 1) -->
      <div class="w-full flex items-center justify-around gap-2 px-2">
        <!-- Bit 3: Değer 8 -->
        <div onclick="toggleBit(3)" class="flex flex-col items-center gap-1.5 cursor-pointer">
          <div id="bulb-3" class="w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300">
            <span id="icon-3" class="text-xs grayscale opacity-40">💡</span>
            <span id="sub-3" class="text-[9px] text-zinc-400 font-bold">••••••••</span>
          </div>
          <button id="switch-3" class="w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors">
            <div id="knob-3" class="w-4 h-4 rounded-full bg-white transition-transform"></div>
          </button>
          <span id="label-3" class="text-[10px] font-bold text-[var(--muted-foreground)]">+8</span>
        </div>

        <!-- Bit 2: Değer 4 -->
        <div onclick="toggleBit(2)" class="flex flex-col items-center gap-1.5 cursor-pointer">
          <div id="bulb-2" class="w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300">
            <span id="icon-2" class="text-xs grayscale opacity-40">💡</span>
            <span id="sub-2" class="text-[9px] text-zinc-400 font-bold">••••</span>
          </div>
          <button id="switch-2" class="w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors">
            <div id="knob-2" class="w-4 h-4 rounded-full bg-white transition-transform"></div>
          </button>
          <span id="label-2" class="text-[10px] font-bold text-[var(--muted-foreground)]">+4</span>
        </div>

        <!-- Bit 1: Değer 2 -->
        <div onclick="toggleBit(1)" class="flex flex-col items-center gap-1.5 cursor-pointer">
          <div id="bulb-1" class="w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300">
            <span id="icon-1" class="text-xs grayscale opacity-40">💡</span>
            <span id="sub-1" class="text-[9px] text-zinc-400 font-bold">••</span>
          </div>
          <button id="switch-1" class="w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors">
            <div id="knob-1" class="w-4 h-4 rounded-full bg-white transition-transform"></div>
          </button>
          <span id="label-1" class="text-[10px] font-bold text-[var(--muted-foreground)]">+2</span>
        </div>

        <!-- Bit 0: Değer 1 -->
        <div onclick="toggleBit(0)" class="flex flex-col items-center gap-1.5 cursor-pointer">
          <div id="bulb-0" class="w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300">
            <span id="icon-0" class="text-xs grayscale opacity-40">💡</span>
            <span id="sub-0" class="text-[9px] text-zinc-400 font-bold">•</span>
          </div>
          <button id="switch-0" class="w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors">
            <div id="knob-0" class="w-4 h-4 rounded-full bg-white transition-transform"></div>
          </button>
          <span id="label-0" class="text-[10px] font-bold text-[var(--muted-foreground)]">+1</span>
        </div>
      </div>

      <!-- Durum Mesajı -->
      <div id="resultMsg" class="text-xs font-semibold text-[var(--muted-foreground)] flex items-center gap-2">
        <span>Anahtarları açarak hedef sayıya ulaş!</span>
      </div>
    </div>

    <!-- Alt Kısım -->
    <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
      <span>7-9 yaş benek sayar; 10-14 yaş ikili taban (8-4-2-1) bit mantığını kavrar.</span>
      <button onclick="newTarget()" class="text-xs text-[var(--primary)] font-bold hover:underline">🎲 Yeni Hedef İste</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playBeep(freq) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

    const bitValues = [1, 2, 4, 8];
    const bitFreqs = [261.63, 329.63, 392.00, 523.25];
    let bits = [0, 0, 0, 0];
    let target = 5;
    let currentTier = 'kids';

    function setTier(tier) {
      currentTier = tier;
      document.getElementById('tierKids').className = tier === 'kids' 
        ? "px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold" 
        : "px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold";
      document.getElementById('tierPro').className = tier === 'pro' 
        ? "px-2 py-0.5 rounded bg-[var(--primary)] text-white font-semibold" 
        : "px-2 py-0.5 rounded text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-semibold";

      for (let i = 0; i < 4; i++) {
        const sub = document.getElementById(`sub-${i}`);
        const label = document.getElementById(`label-${i}`);
        if (tier === 'kids') {
          sub.innerText = "•".repeat(bitValues[i]);
          label.innerText = `+${bitValues[i]}`;
        } else {
          sub.innerText = `Bit ${i}`;
          label.innerText = `2^${i} = ${bitValues[i]}`;
        }
      }
    }

    function toggleBit(i) {
      bits[i] = bits[i] === 0 ? 1 : 0;
      if (bits[i] === 1) playBeep(bitFreqs[i]);

      const bulb = document.getElementById(`bulb-${i}`);
      const icon = document.getElementById(`icon-${i}`);
      const sw = document.getElementById(`switch-${i}`);
      const knob = document.getElementById(`knob-${i}`);

      if (bits[i] === 1) {
        bulb.className = "w-12 h-14 rounded-full border-2 border-yellow-400 bg-yellow-400/30 shadow-[0_0_18px_rgba(250,204,21,0.6)] flex flex-col items-center justify-center transition-all duration-300";
        icon.className = "text-xs grayscale-0 opacity-100";
        sw.className = "w-9 h-5 rounded-full bg-emerald-500 p-0.5 transition-colors";
        knob.style.transform = "translateX(16px)";
      } else {
        bulb.className = "w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300";
        icon.className = "text-xs grayscale opacity-40";
        sw.className = "w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors";
        knob.style.transform = "translateX(0px)";
      }

      checkSum();
    }

    function checkSum() {
      const sum = bits[0]*1 + bits[1]*2 + bits[2]*4 + bits[3]*8;
      const totalBadge = document.getElementById('currentTotalBadge');
      totalBadge.innerText = sum;

      const msg = document.getElementById('resultMsg');
      if (sum === target) {
        totalBadge.className = "px-3 py-0.5 rounded-full bg-emerald-500 text-white font-black text-sm tabular-nums animate-bounce";
        msg.innerHTML = `<span class="text-emerald-500 font-bold">🎉 Harika! Hedef ${target} sayısına ulaştın! (İkili Kod: ${bits.slice().reverse().join('')})</span>`;
        playBeep(659.25);
      } else if (sum > target) {
        totalBadge.className = "px-3 py-0.5 rounded-full bg-red-500 text-white font-black text-sm tabular-nums";
        msg.innerHTML = `<span class="text-amber-500 font-medium">Hedefi geçtin (${sum} > ${target}). Bir ampul söndür!</span>`;
      } else {
        totalBadge.className = "px-3 py-0.5 rounded-full bg-zinc-700 text-white font-black text-sm tabular-nums";
        msg.innerHTML = `<span class="text-[var(--muted-foreground)]">Doğru ampulleri açarak ${target} yap!</span>`;
      }
    }

    function newTarget() {
      target = Math.floor(Math.random() * 14) + 1;
      document.getElementById('targetValueBadge').innerText = target;
      bits = [0, 0, 0, 0];
      for (let i = 0; i < 4; i++) {
        document.getElementById(`bulb-${i}`).className = "w-12 h-14 rounded-full border-2 border-zinc-600 bg-zinc-800/40 flex flex-col items-center justify-center transition-all duration-300";
        document.getElementById(`icon-${i}`).className = "text-xs grayscale opacity-40";
        document.getElementById(`switch-${i}`).className = "w-9 h-5 rounded-full bg-zinc-700 p-0.5 transition-colors";
        document.getElementById(`knob-${i}`).style.transform = "translateX(0px)";
      }
      checkSum();
    }
  </script>
</body>
</html>
