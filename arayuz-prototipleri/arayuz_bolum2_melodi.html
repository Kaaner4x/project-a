<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2 space-y-3 font-sans">
    <!-- Başlık -->
    <div class="flex items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-yellow-500">💡 Bölüm 2: Ksilofon Ampuller</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/10 text-yellow-600 font-medium">Melodik Gam / Audio</span>
      </div>
      <span class="text-xs text-[var(--muted-foreground)]">Parmağını / fareni ampullerin üstünde kaydır!</span>
    </div>

    <!-- Ampul Tuvali -->
    <div class="relative w-full h-[230px] rounded-xl border border-[var(--card-border)] bg-[var(--card)] flex flex-col items-center justify-center p-4 overflow-hidden shadow-inner">
      <div class="w-full flex items-center justify-between gap-3 px-2">
        <!-- Ampul 1: Do -->
        <div onpointerenter="triggerBulb(0)" onclick="triggerBulb(0)" id="bulb-0" class="bulb-item flex-1 flex flex-col items-center gap-2 cursor-pointer transition-all duration-200 hover:-translate-y-2">
          <div class="w-2 h-8 bg-zinc-600 rounded-t-sm"></div>
          <div class="bulb-glass w-14 h-16 rounded-full bg-red-500/20 border-2 border-red-400 flex flex-col items-center justify-center shadow-sm transition-all">
            <span class="text-lg">🔴</span>
            <span class="text-[10px] font-bold text-red-400">Do (C)</span>
          </div>
          <div class="text-[11px] font-mono text-[var(--muted-foreground)]">1. Nota</div>
        </div>

        <!-- Ampul 2: Re -->
        <div onpointerenter="triggerBulb(1)" onclick="triggerBulb(1)" id="bulb-1" class="bulb-item flex-1 flex flex-col items-center gap-2 cursor-pointer transition-all duration-200 hover:-translate-y-2">
          <div class="w-2 h-8 bg-zinc-600 rounded-t-sm"></div>
          <div class="bulb-glass w-14 h-16 rounded-full bg-amber-500/20 border-2 border-amber-400 flex flex-col items-center justify-center shadow-sm transition-all">
            <span class="text-lg">🟠</span>
            <span class="text-[10px] font-bold text-amber-500">Re (D)</span>
          </div>
          <div class="text-[11px] font-mono text-[var(--muted-foreground)]">2. Nota</div>
        </div>

        <!-- Ampul 3: Mi -->
        <div onpointerenter="triggerBulb(2)" onclick="triggerBulb(2)" id="bulb-2" class="bulb-item flex-1 flex flex-col items-center gap-2 cursor-pointer transition-all duration-200 hover:-translate-y-2">
          <div class="w-2 h-8 bg-zinc-600 rounded-t-sm"></div>
          <div class="bulb-glass w-14 h-16 rounded-full bg-yellow-500/20 border-2 border-yellow-400 flex flex-col items-center justify-center shadow-sm transition-all">
            <span class="text-lg">🟡</span>
            <span class="text-[10px] font-bold text-yellow-500">Mi (E)</span>
          </div>
          <div class="text-[11px] font-mono text-[var(--muted-foreground)]">3. Nota</div>
        </div>

        <!-- Ampul 4: Sol -->
        <div onpointerenter="triggerBulb(3)" onclick="triggerBulb(3)" id="bulb-3" class="bulb-item flex-1 flex flex-col items-center gap-2 cursor-pointer transition-all duration-200 hover:-translate-y-2">
          <div class="w-2 h-8 bg-zinc-600 rounded-t-sm"></div>
          <div class="bulb-glass w-14 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex flex-col items-center justify-center shadow-sm transition-all">
            <span class="text-lg">🟢</span>
            <span class="text-[10px] font-bold text-emerald-400">Sol (G)</span>
          </div>
          <div class="text-[11px] font-mono text-[var(--muted-foreground)]">4. Nota</div>
        </div>

        <!-- Ampul 5: La -->
        <div onpointerenter="triggerBulb(4)" onclick="triggerBulb(4)" id="bulb-4" class="bulb-item flex-1 flex flex-col items-center gap-2 cursor-pointer transition-all duration-200 hover:-translate-y-2">
          <div class="w-2 h-8 bg-zinc-600 rounded-t-sm"></div>
          <div class="bulb-glass w-14 h-16 rounded-full bg-blue-500/20 border-2 border-blue-400 flex flex-col items-center justify-center shadow-sm transition-all">
            <span class="text-lg">🔵</span>
            <span class="text-[10px] font-bold text-blue-400">La (A)</span>
          </div>
          <div class="text-[11px] font-mono text-[var(--muted-foreground)]">5. Nota</div>
        </div>
      </div>

      <!-- Alt Melodi Çubuğu -->
      <div id="playedNotes" class="mt-4 px-4 py-1.5 rounded-full bg-[var(--background)]/80 border border-[var(--card-border)] text-xs font-mono tracking-widest text-[var(--primary)] flex items-center gap-2">
        <span>Çalınan:</span>
        <span id="noteList" class="font-bold">---</span>
      </div>
    </div>

    <!-- Alt Açıklama -->
    <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
      <span>Pasif izleyici yerine çocuğun parmak hareketiyle müzik ve ışık ürettiği aktif tuval.</span>
      <button onclick="playArpeggio()" class="text-xs text-[var(--primary)] font-bold hover:underline">♫ Otomatik Melodi Çal</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const freqs = [261.63, 293.66, 329.63, 392.00, 440.00];
    const noteNames = ["Do", "Re", "Mi", "Sol", "La"];
    const colors = ["#ef4444", "#f59e0b", "#eab308", "#10b981", "#3b82f6"];
    let history = [];

    function playNote(idx) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freqs[idx], ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    }

    function triggerBulb(idx) {
      playNote(idx);
      const item = document.getElementById(`bulb-${idx}`);
      const glass = item.querySelector('.bulb-glass');
      
      glass.style.backgroundColor = colors[idx];
      glass.style.boxShadow = `0 0 25px ${colors[idx]}`;
      glass.style.transform = "scale(1.12)";

      setTimeout(() => {
        glass.style.backgroundColor = "";
        glass.style.boxShadow = "";
        glass.style.transform = "";
      }, 350);

      history.push(noteNames[idx]);
      if (history.length > 6) history.shift();
      document.getElementById('noteList').innerText = history.join(" - ");
    }

    function playArpeggio() {
      [0, 1, 2, 3, 4, 3, 2, 1, 0].forEach((noteIdx, step) => {
        setTimeout(() => triggerBulb(noteIdx), step * 160);
      });
    }
  </script>
</body>
</html>
